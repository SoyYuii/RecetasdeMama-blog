<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recetas de Mamá</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #faf5ec;
            color: #342b26;
        }

        .navbar {
            background-color: #a74732;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-img-top {
            height: 230px;
            object-fit: cover;
        }

        .btn-receta {
            background-color: #a74732;
            color: white;
        }

        .btn-receta:hover {
            background-color: #843624;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">
                Recetas de Mamá
            </a>

            <div>
                <a class="nav-link" href="{% url 'recetas:lista' %}">
                    Ver recetas
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center py-4">
        <p>Recetas de Mamá © 2026</p>
    </footer>

</body>
</html>
