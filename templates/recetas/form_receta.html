{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <h1 class="mb-4">{{ titulo_pagina }}</h1>

        <div class="card shadow-sm p-4">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ formulario.as_p }}

                <button type="submit" class="btn btn-receta">
                    Guardar receta
                </button>

                <a href="{% url 'recetas:lista' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
